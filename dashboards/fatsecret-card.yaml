# Lovelace card. Requires these HACS frontend cards:
#   - Mushroom
#   - ApexCharts Card
# Paste the contents into a Manual card or the dashboard raw editor.

type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    primary: >-
      Сегодня: {{ states('sensor.calories') | float(0) | round(0) }} из
      {{ states('input_number.fatsecret_calorie_goal') | float(0) | round(0) }} ккал
    secondary: >-
      {% set eaten = states('sensor.calories') | float(0) %}
      {% set goal = states('input_number.fatsecret_calorie_goal') | float(0) %}
      {% set left = goal - eaten %}
      {% if left >= 0 %}
        Осталось {{ left | round(0) }} ккал · обновлено
        {{ relative_time(states.sensor.calories.last_updated) }} назад
      {% else %}
        Превышение на {{ (left | abs) | round(0) }} ккал · обновлено
        {{ relative_time(states.sensor.calories.last_updated) }} назад
      {% endif %}
    icon: mdi:food-apple
    icon_color: >-
      {% set p = states('sensor.fatsecret_calorie_progress') | float(0) %}
      {{ 'red' if p > 105 else 'green' if p >= 85 else 'orange' }}
    multiline_secondary: true
    tap_action:
      action: more-info
      entity: sensor.calories

  - type: grid
    columns: 2
    square: false
    cards:
      - type: gauge
        entity: sensor.fatsecret_calorie_progress
        name: Калории
        min: 0
        max: 120
        needle: true
        severity:
          green: 0
          yellow: 85
          red: 105
      - type: gauge
        entity: sensor.fatsecret_protein_progress
        name: Белок
        min: 0
        max: 120
        needle: true
        severity:
          red: 0
          yellow: 60
          green: 85
      - type: gauge
        entity: sensor.fatsecret_carbohydrate_progress
        name: Углеводы
        min: 0
        max: 120
        needle: true
        severity:
          green: 0
          yellow: 90
          red: 110
      - type: gauge
        entity: sensor.fatsecret_fat_progress
        name: Жиры
        min: 0
        max: 120
        needle: true
        severity:
          green: 0
          yellow: 90
          red: 110

  - type: entities
    title: БЖУ и нутриенты
    show_header_toggle: false
    state_color: true
    entities:
      - entity: sensor.protein
        name: Белок
        icon: mdi:food-drumstick
      - entity: sensor.carbohydrates
        name: Углеводы
        icon: mdi:barley
      - entity: sensor.fat
        name: Жиры
        icon: mdi:oil
      - entity: sensor.fiber
        name: Клетчатка
        icon: mdi:leaf
      - entity: sensor.sugar
        name: Сахар
        icon: mdi:spoon-sugar
      - entity: sensor.sodium
        name: Натрий
        icon: mdi:shaker-outline
      - entity: sensor.potassium
        name: Калий
        icon: mdi:lightning-bolt-outline
      - entity: sensor.cholesterol
        name: Холестерин
        icon: mdi:heart-pulse

  - type: custom:apexcharts-card
    graph_span: 24h
    span:
      start: day
    update_interval: 15min
    header:
      show: true
      title: Накопление за сегодня
      show_states: false
    apex_config:
      chart:
        height: 300
      legend:
        show: true
      stroke:
        curve: smooth
      tooltip:
        shared: true
    yaxis:
      - id: kcal
        min: 0
        apex_config:
          title:
            text: kcal
      - id: grams
        min: 0
        opposite: true
        apex_config:
          title:
            text: g
    series:
      - entity: sensor.calories
        name: Калории
        yaxis_id: kcal
        type: area
        color: "#ff9800"
        stroke_width: 3
        opacity: 0.25
        group_by:
          duration: 15min
          func: last
      - entity: sensor.protein
        name: Белок
        yaxis_id: grams
        color: "#4caf50"
        stroke_width: 2
        group_by:
          duration: 15min
          func: last
      - entity: sensor.carbohydrates
        name: Углеводы
        yaxis_id: grams
        color: "#2196f3"
        stroke_width: 2
        group_by:
          duration: 15min
          func: last
      - entity: sensor.fat
        name: Жиры
        yaxis_id: grams
        color: "#e91e63"
        stroke_width: 2
        group_by:
          duration: 15min
          func: last

  - type: entities
    title: Дневные цели
    show_header_toggle: false
    entities:
      - input_number.fatsecret_calorie_goal
      - input_number.fatsecret_protein_goal
      - input_number.fatsecret_carbohydrate_goal
      - input_number.fatsecret_fat_goal
