# Home Assistant package: editable nutrition goals and progress sensors.
# Place this file in /config/packages/fatsecret.yaml and make sure
# configuration.yaml contains:
# homeassistant:
#   packages: !include_dir_named packages

input_number:
  fatsecret_calorie_goal:
    name: FatSecret — цель калорий
    icon: mdi:fire
    min: 500
    max: 5000
    step: 50
    initial: 2200
    unit_of_measurement: kcal
    mode: box

  fatsecret_protein_goal:
    name: FatSecret — цель белка
    icon: mdi:food-drumstick
    min: 10
    max: 400
    step: 5
    initial: 160
    unit_of_measurement: g
    mode: box

  fatsecret_carbohydrate_goal:
    name: FatSecret — цель углеводов
    icon: mdi:barley
    min: 10
    max: 600
    step: 5
    initial: 250
    unit_of_measurement: g
    mode: box

  fatsecret_fat_goal:
    name: FatSecret — цель жиров
    icon: mdi:oil
    min: 10
    max: 250
    step: 5
    initial: 70
    unit_of_measurement: g
    mode: box

template:
  - sensor:
      - name: FatSecret calorie progress
        unique_id: fatsecret_calorie_progress
        icon: mdi:fire
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.calories')) and
             is_number(states('input_number.fatsecret_calorie_goal')) and
             states('input_number.fatsecret_calorie_goal') | float(0) > 0 }}
        state: >-
          {{ [[states('sensor.calories') | float(0) /
                states('input_number.fatsecret_calorie_goal') | float(1) * 100,
                0] | max, 150] | min | round(0) }}

      - name: FatSecret protein progress
        unique_id: fatsecret_protein_progress
        icon: mdi:food-drumstick
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.protein')) and
             states('input_number.fatsecret_protein_goal') | float(0) > 0 }}
        state: >-
          {{ [[states('sensor.protein') | float(0) /
                states('input_number.fatsecret_protein_goal') | float(1) * 100,
                0] | max, 150] | min | round(0) }}

      - name: FatSecret carbohydrate progress
        unique_id: fatsecret_carbohydrate_progress
        icon: mdi:barley
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.carbohydrates')) and
             states('input_number.fatsecret_carbohydrate_goal') | float(0) > 0 }}
        state: >-
          {{ [[states('sensor.carbohydrates') | float(0) /
                states('input_number.fatsecret_carbohydrate_goal') | float(1) * 100,
                0] | max, 150] | min | round(0) }}

      - name: FatSecret fat progress
        unique_id: fatsecret_fat_progress
        icon: mdi:oil
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.fat')) and
             states('input_number.fatsecret_fat_goal') | float(0) > 0 }}
        state: >-
          {{ [[states('sensor.fat') | float(0) /
                states('input_number.fatsecret_fat_goal') | float(1) * 100,
                0] | max, 150] | min | round(0) }}
